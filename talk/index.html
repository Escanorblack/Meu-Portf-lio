<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ping Pong Avançado</title>
<style>
  body {
    background-color: #111;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  canvas {
    border: 4px solid #333;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    background-color: #1a1a1a;
  }

  .instructions {
    position: absolute;
    bottom: 20px;
    color: #888;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<div class="instructions">
  Use as setas <b>Cima/Baixo</b> ou <b>W/S</b> para mover sua raquete
</div>
