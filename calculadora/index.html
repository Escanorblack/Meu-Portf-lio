<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Simples</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; }
    .calculadora { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
    #visor { width: 100%; height: 40px; font-size: 18px; text-align: right; margin-bottom: 10px; padding: 5px; box-sizing: border-box; }
    .botoes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    button { padding: 15px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

<div class="calculadora">
  <input type="text" id="visor" readonly>
  <div class="botoes">
    <button onclick="limpar()">C</button>
    <button onclick="adicionar('/')">/</button>
    <button onclick="adicionar('*')">*</button>
    <button onclick="adicionar('-')">-</button>
    
    <button onclick="adicionar('7')">7</button>
    <button onclick="adicionar('8')">8</button>
    <button onclick="adicionar('9')">9</button>
    <button onclick="adicionar('+')">+</button>
    
    <button onclick="adicionar('4')">4</button>
    <button onclick="adicionar('5')">5</button>
    <button onclick="adicionar('6')">6</button>
    <button onclick="calcular()">=</button>
    
    <button onclick="adicionar('1')">1</button>
    <button onclick="adicionar('2')">2</button>
    <button onclick="adicionar('3')">3</button>
    <button onclick="adicionar('0')">0</button>
  </div>
</div>

<script>
  function adicionar(valor) {
    document.getElementById('visor').value += valor;
  }

  function limpar() {
    document.getElementById('visor').value = '';
  }

  function calcular() {
    let resultado = eval(document.getElementById('visor').value);
    document.getElementById('visor').value = resultado;
  }
</script>

</body>
</html>
